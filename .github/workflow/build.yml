name: Build switch-messenger

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    # La imagen oficial de devkitPro ya trae devkitA64 + libnx instalados
    # en /opt/devkitpro, junto con dkp-pacman para instalar los portlibs
    # adicionales que necesita este proyecto (SDL2, SDL2_ttf y sus
    # dependencias). Es la forma reproducible recomendada por devkitPro
    # para compilar en CI, en lugar de instalar el toolchain a mano.
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias de devkitPro (SDL2 para Switch)
        # Se instalan solo los paquetes que el proyecto necesita, sin
        # sincronizar/actualizar todo el árbol de paquetes con -Syu, para
        # evitar romper la imagen de CI por una actualización inesperada.
        run: |
          sudo dkp-pacman -S --noconfirm --needed \
            switch-sdl2 \
            switch-sdl2_ttf \
            switch-freetype \
            switch-libpng \
            switch-zlib \
            switch-bzip2

      - name: make clean
        run: |
          export DEVKITPRO=/opt/devkitpro
          export PATH=$DEVKITPRO/tools/bin:$DEVKITPRO/devkitA64/bin:$PATH
          make clean

      - name: make
        run: |
          export DEVKITPRO=/opt/devkitpro
          export PATH=$DEVKITPRO/tools/bin:$DEVKITPRO/devkitA64/bin:$PATH
          make -j$(nproc)

      - name: Verificar que el .nro fue generado
        run: |
          test -f switch-messenger.nro
          ls -la switch-messenger.nro

      - name: Subir switch-messenger.nro como artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-messenger-nro
          path: switch-messenger.nro
          if-no-files-found: error
